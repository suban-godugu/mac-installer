name: Mac installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build app
        run: npm run build

      - name: Package macOS installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --arm64 --x64 --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: mac-installers
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: Add installers to the download page release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if ! gh release view "v${version}" >/dev/null 2>&1; then
            gh release create "v${version}" --title "Verilumen Prospect Intelligence Browser ${version}" --notes "Mac and Windows installers."
          fi
          gh release upload "v${version}" release/*.dmg release/*.zip --clobber
